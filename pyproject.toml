[project]
name = "lumafit"
version = "0.2.3"
description = "A Numba-accelerated Levenberg-Marquardt fitting library"
readme = "README.md"
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
license = { text = "MIT" }
keywords = [
  "levenberg-marquardt",
  "numba",
  "optimization",
  "fitting",
  "least-squares",
  "scientific",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "numba>=0.61.0",
  "scipy>=1.15.3", # Numba needs SciPy's BLAS/LAPACK for np.linalg and `@`
]

[project.optional-dependencies]
# Fits on any GPU with a Vulkan driver; numba-vulkan needs Python 3.11+.
vulkan = ["numba-vulkan>=0.1.2; python_version >= '3.11'"]

[project.urls]
Documentation = "https://arunoruto.github.io/lumafit/"
Repository = "https://github.com/arunoruto/lumafit"
Changelog = "https://github.com/arunoruto/lumafit/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
  "myst-parser>=4.0.1",
  "shibuya>=2026.7.12",
  "sphinx-autoapi>=3.6.0",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx>=8.1.3",
  "sphinxcontrib-bibtex>=2.6.3",
  "sphinxcontrib-napoleon>=0.7",
  "linkify-it-py>=2.0.3",
  "setuptools>=61.0",
]
test = ["pytest>=8.3.3", "pytest-cov>=6.1.1"]
bench = [
  "jax>=0.6.2",
  "matplotlib>=3.10",
  "numba-vulkan>=0.1.2; python_version >= '3.11'",
  "optimistix>=0.0.11",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--doctest-modules"
log_cli = true
log_level = "INFO"
log_format = "%(asctime)s - %(name)-8s - %(levelname)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests", "src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
branch = "main"

[build-system]
requires = ["uv_build >= 0.8.0, <1.0.0"]
build-backend = "uv_build"
